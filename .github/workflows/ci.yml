name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Type check (client + server, baseline unused-var warnings ignored)
        run: npm run typecheck
      - name: Server bundle builds
        run: npx esbuild server/app.ts --bundle --platform=node --format=esm --packages=external --log-level=warning --outfile=server/dist/app.mjs
      - name: Game logic tests
        run: npm run test:game
      - name: Smoke tests
        run: npm run test:smoke
